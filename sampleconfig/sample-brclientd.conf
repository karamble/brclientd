[Application Options]

; ------------------------------------------------------------------------------
; Data settings
; ------------------------------------------------------------------------------

; Top-level application data directory. Defaults to ~/.brclientd on Linux,
; $LOCALAPPDATA/Brclientd on Windows, ~/Library/Application Support/Brclientd
; on macOS.
; appdata=~/.brclientd

; Directory for Bison Relay client state (DB, messages, downloads, embeds).
; Defaults to <appdata>/data/<network>.
; datadir=~/.brclientd/data/mainnet

; Directory for log output. Defaults to <appdata>/logs/<network>.
; logdir=~/.brclientd/logs/mainnet

; Logging level. One of: trace, debug, info, warn, error, critical.
; debuglevel=info


; ------------------------------------------------------------------------------
; Network settings
; ------------------------------------------------------------------------------

; Use the test network.
; testnet=1

; Use the simulation network.
; simnet=1

; Bison Relay relay server address.
; brserver=bisonrelay.org:443


; ------------------------------------------------------------------------------
; Proxy (Tor) settings
; ------------------------------------------------------------------------------

; Connect to the Bison Relay server and seeder through a SOCKS5 proxy (for
; example a local Tor daemon). The dcrlnd gRPC connection stays direct.
; proxy=127.0.0.1:9050

; Username for the SOCKS5 proxy, if it requires authentication.
; proxyuser=

; Password for the SOCKS5 proxy, if it requires authentication.
; proxypass=

; Enable Tor stream isolation by randomizing proxy credentials per connection.
; torisolation=1

; Maximum number of open connections per proxy circuit (only used with Tor
; stream isolation). Defaults to 32.
; circuitlimit=32


[dcrlnd options]

; ------------------------------------------------------------------------------
; dcrlnd connection
; ------------------------------------------------------------------------------

; dcrlnd gRPC host and port.
; dcrlnd.rpchost=127.0.0.1:10009

; Path to dcrlnd's TLS certificate (~/.dcrlnd/tls.cert by default).
; dcrlnd.tlscertpath=~/.dcrlnd/tls.cert

; Path to dcrlnd's admin macaroon.
; dcrlnd.macaroonpath=~/.dcrlnd/data/chain/decred/mainnet/admin.macaroon


[clientrpc options]

; ------------------------------------------------------------------------------
; clientrpc (JSON-RPC over WebSocket)
; ------------------------------------------------------------------------------

; Add one interface:port the clientrpc server listens on. Repeat to bind
; multiple interfaces. Defaults to 0.0.0.0:7676 if unset.
; clientrpc.listen=0.0.0.0:7676

; Auto-generate the rpc-client cert pair on first run.
; clientrpc.issueclientcert=1


[status options]

; ------------------------------------------------------------------------------
; /status HTTP endpoint
; ------------------------------------------------------------------------------

; Address the /status HTTP endpoint binds to. Returns the current Bison Relay
; connection state + CheckLNWalletUsable error (if any) as JSON.
; status.listen=0.0.0.0:7677


[mcp options]

; ------------------------------------------------------------------------------
; MCP-over-Bison-Relay client listener
; ------------------------------------------------------------------------------

; Address the MCP client listener binds to. It serves paid MCP tools proxied
; from Bison Relay bots to a local AI agent. Default loopback; set to 0.0.0.0
; to reach it from the LAN. Restart to change (not runtime-rebindable).
; mcp.mcplisten=127.0.0.1:8891


[simplestore options]

; ------------------------------------------------------------------------------
; SimpleStore hosting
; ------------------------------------------------------------------------------

; Host a simplestore over the relay instead of static pages. When enabled the
; node binds one resource provider serving the store at the root.
; simplestore.enabled=1

; How to charge for orders: ln (Lightning) or onchain. Defaults to ln.
; simplestore.paytype=ln

; Wallet account used to derive on-chain order addresses (onchain paytype only).
; simplestore.account=

; Flat shipping surcharge in USD added to each order.
; simplestore.shipcharge=0
